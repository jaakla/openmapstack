overrides: []
processing:
  analysis_crs: EPSG:32618
  storage_crs: EPSG:4326
  steps:
  - id: load_zones
    operation: read
    source: taxi_zones
    output: zones_raw
  - id: load_hubs
    operation: read
    source: hubs
    output: hubs_raw
  - id: load_fleet
    operation: read
    source: fleet_positions
    expression: geom IS NOT NULL
    output: fleet_raw
  - id: load_accounts
    operation: read
    source: customer_accounts
    expression: is_active = true
    output: accounts_raw
  - id: load_demand
    operation: read
    source: trip_events
    expression: Pinned BigQuery trip points; tenant alpha visible to reader
    output: trip_events_raw
  - id: load_market
    operation: read
    source: market_scores
    expression: Pinned MotherDuck market scores keyed to source zone IDs
    output: market_scores_raw
  - id: load_market_reference_zones
    operation: read
    source: market_reference_zones
    output: market_reference_zones_raw
  - id: load_market_pois
    operation: read
    source: market_pois
    output: market_pois_raw
  - id: aggregate_trips_to_h3
    operation: spatial_join
    inputs:
    - zones_raw
    - trip_events_raw
    expression: ST_Contains(H3 polygon, pickup_point), grouped by H3 cell and date
    output: zone_demand_h3
  - id: attribute_market_to_h3
    operation: spatial_join
    inputs:
    - zones_raw
    - market_reference_zones_raw
    - market_scores_raw
    - market_pois_raw
    expression: Unique reference polygon containing H3 centroid determines score; count POI points contained
      in H3 polygon
    output: zone_market_h3
  - id: project_zones
    operation: project
    input: zones_raw
    expression: ST_Transform(geom, 32618)
    output: zones_metric
  - id: hub_distances
    operation: spatial_join
    inputs:
    - zones_metric
    - hubs_raw
    expression: min(ST_Distance(zone_centroid, hub_geom)) per zone
    crs: EPSG:32618
    output: zone_hub_distance
  - id: fleet_by_zone
    operation: aggregate
    input: fleet_raw
    expression: latest recorded_at per tenant_id and vehicle_id, position_id tie-break; count by h3_cell
    output: zone_fleet_counts
  - id: accounts_by_zone
    operation: aggregate
    input: accounts_raw
    expression: count(*) grouped by h3_cell (active accounts present today)
    output: zone_accounts
  - id: export_fleet_points
    operation: export
    input: fleet_raw
    expression: Latest located observation per synthetic vehicle, preserving location-basis label
    output: fleet_positions_geojson
  - id: combine_metrics
    operation: join
    inputs:
    - zones_raw
    - zone_hub_distance
    - zone_fleet_counts
    - zone_accounts
    - zone_demand_h3
    - zone_market_h3
    output: zone_metrics
  - id: eligible_zones
    operation: filter
    input: zone_metrics
    expression: trips_total >= 30 AND hub_distance_m >= 1500 AND fleet_present <= 6
    output: eligible_candidates
  - id: score_candidates
    operation: score
    input: eligible_candidates
    expression: 100 * (0.45*demand_score + 0.30*coverage_gap_score + 0.15*market_score + 0.10*saturation_score)
    output: scored_candidates
  - id: export_candidates
    operation: export
    input: scored_candidates
    output: hub_candidates
scoring:
  weights:
    demand: 0.45
    coverage_gap: 0.3
    market: 0.15
    saturation: 0.1
  components:
    demand_score: 'trips_total / max eligible trips_total (BigQuery: historical demand)'
    coverage_gap_score: 'hub_distance_m / max eligible hub_distance_m (PostGIS: hub coverage)'
    market_score: '0.5*market_score_raw + 0.3*min(1, (charging_pois + parking_pois + transit_pois)/amenity_pois_for_full_score)
      + 0.2*(1 - min(1, competitor_pois/competitor_pois_for_full_pressure)) (MotherDuck: market context),
      rounded to 6 decimals'
    saturation_score: '1 - fleet_present / max eligible fleet_present (PostGIS: current fleet)'
    amenity_pois_for_full_score: 6
    competitor_pois_for_full_pressure: 3
  final_score: 100 * sum(weight * component), rounded to 2 decimals; every input is stored beside the
    score, so it is recomputable from data/derived/zone-metrics.parquet alone
  eligibility:
    trips_total_min: 30
    hub_distance_m_min: 1500
    fleet_present_max: 6
outputs:
  existing_hubs_geojson:
    path: data/derived/existing-hubs.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: combine_metrics
  zone_metrics_parquet:
    path: data/derived/zone-metrics.parquet
    format: GeoParquet (EPSG:4326)
    generated_by: combine_metrics
  hub_candidates_parquet:
    path: data/derived/hub-candidates.parquet
    format: GeoParquet (EPSG:4326)
    generated_by: export_candidates
  hub_candidates_geojson:
    path: data/derived/hub-candidates.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: export_candidates
  zone_metrics_geojson:
    path: data/derived/zone-metrics.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: combine_metrics
  qgis_project:
    path: project.qgz
    format: QGIS project archive (EPSG:4326)
    generated_by: export_candidates
  fleet_positions_geojson:
    path: data/derived/fleet-positions.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: export_fleet_points
validation:
  required:
  - geometry_valid
  - crs_known
  - row_count_gt_zero
  - no_null_zone_id
  - rls_scope_alpha_only
  - protected_columns_absent
  - score_components_complete
  - qgis_project_static_valid
  - fleet_latest_observation
  - h3_grid_valid
  - h3_references_consistent
  domain_checks:
  - name: score_range
    expression: final_score >= 0 AND final_score <= 100
  - name: eligibility_thresholds
    expression: trips_total >= 30 AND hub_distance_m >= 1500 AND fleet_present <= 6
