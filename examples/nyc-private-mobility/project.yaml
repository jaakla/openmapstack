  environment:
    python: '3.12'
    duckdb: 1.5.5
    h3: 4.5.0
    gdal: DuckDB spatial extension
  fixture:
    profile: live-seeded-demo-tlc-v1
    h3_resolution: 8
    source_manifest: data/source/live-20260928-tlc-v1/manifest.json
presentation:
  design_language: openmapstack-views/0.1
  layout:
    type: map_with_sidebar
    sidebar:
      position: left
      organization: tabs
      tabs:
      - id: analysis
        title: Analysis
      - id: map
        title: Map
      - id: data
        title: Provenance
  dashboard:
    template: dashboard-template.html
    context: existing_hubs_geojson
    find: Zone search narrows the list by name or cell id. It has no enumerable states, so it is not a
      declared control, but a non-empty search marks the view exploratory like a filter.
    selection: Linked grid-cell map, ranked list and score explanation
    state: URL fragment; filters only narrow fixed run scores, never recalculate them
    caveat: Live captures of synthetic business data over real H3 cells. Some synthetic fleet locations
      reuse historical 2016 TLC taxi pickup coordinates; the point layer is not live tracking.
  controls:
    reconfigurable: true
    canonical_reset: true
    off_canonical_labelling: required
    filters:
    - id: borough
      label: Borough
      type: choice
      canonical: all
    - id: eligibility
      label: Show
      type: choice
      options:
      - eligible
      - all
      canonical: eligible
    - id: minimum_score
      label: Minimum candidate score
      type: range
      field: final_score
      unit: score (0-100)
      canonical: 0
      step: 1
  map:
    basemap:
      id: cartodb-positron
      kind: vector-style
      url: https://basemaps.cartocdn.com/gl/positron-gl-style/style.json
      attribution: © OpenStreetMap contributors © CARTO
      default_visible: true
    layers:
    - source: hub_candidates_geojson
      semantic_role: primary_result
    - source: zone_metrics_geojson
      semantic_role: context
    layer_groups:
    - id: result
      title: Hub Candidates (ranked, tenant alpha)
    - id: context
      title: Basemap Context
  provenance_ui:
    distinctions:
    - PostGIS supplies H3 resolution-8 study cells; integer aliases are not NYC TLC zone IDs.
    - BigQuery trip pickup points are spatially assigned to PostGIS H3 cells; its legacy taxi_zones table
      only maps market-reference polygons.
    - MotherDuck zone scores are attributed by H3 centroid through BigQuery reference polygons; MotherDuck
      POIs are counted directly in H3 cells.
    - All business data is synthetic demo seed data captured from live provisioned services on 2026-09-28.
    - The fleet point layer combines the seeded PostGIS fleet with 281 synthetic vehicles placed at pinned
      2016 TLC taxi pickup coordinates. Vehicle IDs, statuses and 2026 timestamps are generated demo attributes.
    - Captures used restricted PostGIS and BigQuery readers and a read-only MotherDuck connector session;
      the MotherDuck token itself remains writable outside that session.
    - The pipeline consumes pinned local captures and works with service credentials unset.
    - No raw vehicle or customer records appear in the dashboard; only aggregate analysis evidence.
  intent: analytical_workspace
  primary_view: map
