schema: openmapstack-project/v1
project:
  id: nyc-private-mobility
  title: Northstar Mobility — NYC operations/charging hub candidates (tenant alpha)
  question: Identify promising NYC areas for a new operations/charging hub for tenant alpha, using current
    fleet and hub coverage and account demand, and show ranked candidate zones on an interactive map while
    respecting all database access restrictions.
  created_at: '2026-09-17T00:00:00Z'
  updated_at: '2026-10-07T18:28:13.141947+00:00'
  status: validated
interpretation:
  objective: Rank NYC H3 resolution-8 cells for tenant alpha using pinned read-only captures of the provisioned
    PostGIS, BigQuery and MotherDuck demo databases. Spatially assign BigQuery trip pickups and MotherDuck
    POIs to PostGIS H3 cells; attribute MotherDuck source-zone scores through BigQuery reference polygons.
  assumptions:
  - id: A1
    statement: Business observations are synthetic demo data captured from live services. Some synthetic
      fleet point locations reuse actual 2016 NYC TLC trip pickup coordinates; they are not tracked vehicles.
    rationale: The PostGIS fleet seed generates vehicle IDs, statuses and 2026 timestamps for 281 pinned
      TLC pickup coordinates. The coordinates are historical public trip data, not current fleet evidence.
  - id: A2
    statement: Demand is the number of reader-visible tenant-alpha BigQuery trip pickups spatially contained
      in each PostGIS H3 cell, over the dates present in the captured trip table. Peak day, variability,
      active days and mean distance are retained.
    rationale: The live BigQuery table retains legacy source zones. Point-based aggregation avoids claiming
      those rectangular zones are H3 cells; trips outside the study grid are excluded.
  - id: A3
    statement: Distance to the closest existing hub is measured from the zone centroid in EPSG:32618 (UTM
      18N, metres).
    rationale: A local metric CRS for NYC; centroid-level screening is appropriate for zone-level siting.
  - id: A4
    statement: Market context combines MotherDuck source-zone scores attributed by H3 cell centre through
      BigQuery reference polygons with POIs counted directly inside H3 cells.
    rationale: Every H3 centre must match exactly one reference polygon and a reader-visible score. POI
      counts and raw market score are stored in zone-metrics.parquet.
  - id: A5
    statement: PostGIS supplies genuine H3 resolution-8 geometries for a land-centred study grid. Integer
      zone IDs are compatibility aliases, not NYC TLC identifiers.
    rationale: The PostGIS seed derives polygon geometry from pinned H3 cell IDs using h3-pg functions;
      the live reader capture is the analysis input.
  - id: A6
    statement: Fleet presence counts each synthetic vehicle once using its latest recorded_at observation.
      The expanded demo seed includes 281 synthetic tenant-alpha vehicles located at pinned 2016 TLC pickup
      coordinates.
    rationale: The public coordinates are location seeds only. No TLC vehicle identity or live telemetry
      is represented; position_id breaks timestamp ties.
  - id: A7
    statement: The three provisioned services contain seeded synthetic business data. TLC 2016 pickup
      coordinates were separately captured as historical public source geography and reused to enrich
      the synthetic PostGIS fleet seed.
    rationale: The analysis uses the reader-visible PostGIS fleet capture after the enrichment; the original
      TLC sample and its source hash remain pinned for provenance.
