name: Claude Code plugin manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    # Schema-only check of .claude-plugin/{plugin,marketplace}.json. No API key
    # and no network access to Anthropic required: `claude plugin validate`
    # reads local manifests. Keeps the Claude Code install path honest without
    # touching the cross-agent skills-CLI install path.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: |
          # Validate the two manifests explicitly. Newer Claude Code versions
          # warn that the maintainer-only root CLAUDE.md is not plugin context,
          # and --strict promotes that warning to an error. The marketplace
          # manifest stays strict. Plugin validation always inspects the plugin
          # root, so it runs without --strict: schema errors still fail it.
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate .claude-plugin/plugin.json

      # Informational only: prints skills/agents/hooks/MCP counts and the
      # projected token cost. Never gates the build.
      - name: Report plugin component inventory
        continue-on-error: true
        run: claude --plugin-dir . plugin details open-map-stack
