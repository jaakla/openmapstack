name: Project homepage

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - scripts/build_project_pages.py
      - tests/test_project_pages.py
      - examples/nyc-private-mobility/dashboard.html
      - examples/nyc-private-mobility/data/derived/**
      - examples/tartu-development/dashboard.html

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Test and assemble static site
        run: |
          python3 -m unittest -v tests.test_project_pages
          python3 scripts/build_project_pages.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
