id: 946-layer-crs-mislabelled
case_type: mutation
modes: [fixture]
score_types: {fixture: mutation_tests}
project_dir: project
hard_gate: true
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen_spatial.py {project_dir} --scenario=extent --break=crs-mislabelled"
  source_baseline:
    - {source: ../../fixtures/spatial-scenarios/crs/parcels-3301.geojson, destination: data/source/parcels-3301.geojson}
    - {source: ../../fixtures/spatial-scenarios/crs/road-4326.geojson, destination: data/source/road-4326.geojson}
    - {source: ../../fixtures/spatial-scenarios/crs/road-3301.geojson, destination: data/source/road-3301.geojson}
mutation:
  control_generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen_spatial.py {project_dir} --scenario=extent"

# EPSG:3301 metres labelled EPSG:4326 in both the file and the manifest, so
# dataset_crs_is agrees with the lie; only the data's location exposes it.
assertions:
  - assert: project.conforms_to_schema
  - assert: project.graph_resolves
  - assert: validation.run_record_matches
  - assert: geodata.layer_extent_within_aoi
    args: {path: data/derived/candidates.parquet}
  - assert: geodata.layer_extent_within_aoi
    args: {path: data/derived/road.geojson}
  - assert: geodata.layer_extent_within_aoi
    args: {path: data/derived/parcels.geojson}
    expect: failed
    expect_code: extent_outside_aoi
