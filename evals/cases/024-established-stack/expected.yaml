id: 024-established-stack
case_type: positive
modes:
- fixture
- live
score_types:
  fixture: contract_ci
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: '{python} {evals_dir}/fixtures/established-stack/gen.py {project_dir}'
  source_baseline:
  - source: ../../fixtures/established-stack/parcels.csv
    destination: data/source/parcels.csv
  clean_rerun: {}
live:
  prompt_file: prompt.md
  agent_workdir: project
  clean_rerun: {}
  fixtures:
  - source: ../../fixtures/established-stack/parcels.csv
    destination: project/data/source/parcels.csv
assertions:
- assert: integration.bindings_valid
- assert: integration.evidence_matches
- assert: project.conforms_to_schema
- assert: project.graph_resolves
- assert: provenance.every_source_pinned
- assert: geodata.crs_not_used_for_metrics
- assert: delivery.selection_is
  args:
    kinds:
    - dashboard
- assert: geodata.row_count
  args:
    path: $OUTPUT:candidates
    equals: 2
- assert: geodata.feature_field_equals
  args:
    path: $OUTPUT:candidates
    id_field: id
    id: donut
    field: area_m2
    equals: 30000.0
- assert: rerun.clean_execution_succeeded
  args:
    rerun_workspace: $RERUN
