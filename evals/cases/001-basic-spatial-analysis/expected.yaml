id: 001-basic-spatial-analysis
case_type: positive
modes: [fixture, visual, live]
score_types:
  fixture: contract_ci
  visual: integration_visual
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: "{python} {evals_dir}/fixtures/reference_pipeline/gen.py {project_dir}"
  source_baseline:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: data/source/pois.geojson }
live:
  prompt_file: prompt.md
  agent_workdir: project
  # The release gate requires the delivered project to rebuild in a clean
  # workspace; the fixture control proves reruns separately in case 005.
  clean_rerun: {}
  fixtures:
    - { source: ../../fixtures/mini-tartu/parcels.geojson, destination: project/data/source/parcels.geojson }
    - { source: ../../fixtures/mini-tartu/roads.geojson, destination: project/data/source/roads.geojson }
    - { source: ../../fixtures/mini-tartu/pois.geojson, destination: project/data/source/pois.geojson }

assertions:
  - assert: project.schema_is
    args: { schema: openmapstack-project/v1 }
  - assert: project.conforms_to_schema
  - assert: project.parses
  - assert: project.graph_resolves
  - assert: project.assumptions_have_rationale
  - assert: project.declared_files_exist
    args:
      files:
        - project.yaml
        - pipeline.py
        - project.qgz
        - dashboard.html
        - validation/latest-report.json

  - assert: provenance.every_source_has_provider_and_access
  - assert: provenance.every_source_pinned
  - assert: provenance.license_present_where_required
  - assert: provenance.rationale_present
  - assert: provenance.semantic_predicate_documented
    args: { source: cadastral_parcels }

  - assert: geodata.crs_not_used_for_metrics
  - assert: geodata.dataset_crs_matches_storage_crs
    args: { path: $OUTPUT:candidate_parcels }
  - assert: geodata.row_count
    args: { path: $OUTPUT:candidate_parcels, at_least: 1 }
  - assert: geodata.geometry_all_valid
    args: { path: $OUTPUT:candidate_parcels }
  - assert: geodata.no_duplicate_ids
    args: { path: $OUTPUT:candidate_parcels, id_field: cadastral_id }
  - assert: geodata.no_null_ids
    args: { path: $OUTPUT:candidate_parcels, id_field: cadastral_id }
  # known geospatial truth: P1, P2, P5 qualify; P3 too far; P4 wrong land use
  - assert: geodata.feature_present
    args: { path: $OUTPUT:candidate_parcels, id_field: cadastral_id, id: P1 }
  - assert: geodata.feature_present
    args: { path: $OUTPUT:candidate_parcels, id_field: cadastral_id, id: P2 }
  - assert: geodata.feature_absent
    args: { path: $OUTPUT:candidate_parcels, id_field: cadastral_id, id: P3 }
  - assert: geodata.feature_absent
    args: { path: $OUTPUT:candidate_parcels, id_field: cadastral_id, id: P4 }
  - assert: geodata.row_count
    args: { path: $OUTPUT:candidate_parcels, equals: 3 }

  - assert: validation.required_all_present
  - assert: validation.no_implicit_pass
  - assert: validation.run_record_matches
  - assert: validation.report_evidence_recomputes
    args:
      evidence:
        - { check_id: geometry_valid, evidence_field: features_checked, metric: row_count, path: $OUTPUT:candidate_parcels }
        - { check_id: geometry_valid, evidence_field: invalid_count, metric: invalid_geometry_count, path: $OUTPUT:candidate_parcels }
        - { check_id: no_duplicate_cadastral_id, evidence_field: duplicates, metric: duplicate_count, path: $OUTPUT:candidate_parcels, field: cadastral_id }
        - { check_id: no_null_cadastral_id, evidence_field: nulls, metric: null_count, path: $OUTPUT:candidate_parcels, field: cadastral_id }

  - assert: qgis.static_valid
  # GeoParquet layers open invalid in QGIS builds without GDAL's optional
  # Parquet driver, including stock Ubuntu packages.
  - assert: qgis.datasources_portable
  - assert: qgis.styles_declared
  # A layer with no declared CRS is assumed to be in the project CRS and
  # never reprojected — which put the Web Mercator basemap 1500 km from
  # the Estonian data while every other check passed.
  - assert: qgis.every_layer_declares_crs
  # A declared CRS must also be the data's: WGS84 GeoJSON declared as
  # EPSG:3301 drew the roads far from Tartu in a real QGIS.
  - assert: qgis.layer_crs_matches_data
  - assert: qgis.groups_match_manifest
  # A non-QGIS unit-test interpreter records this explicitly as not_testable;
  # the scheduled QGIS integration environment is expected to make it pass.
  - assert: qgis.runtime_load
    hard_gate: false
    args: { render_png: "../visual/qgis-render.png" }
  # Visual mode is defined as the environment that has PyQGIS and a browser,
  # so its own assertions gate: soft-gating them here would mean a real
  # regression in the integration container still published a green run.
  # Runtime reconciliation of manifest presentation claims against the
  # actually loaded QGIS layers: datasources, CRS, geometry families.
  - assert: qgis.layers_match_manifest
    modes: [visual]
  # The rendered snapshot must show real map content, not a blank frame.
  - assert: visual.render_substantive
    modes: [visual]
    args: { path: "../visual/qgis-render.png" }
  # ...and every declared layer must actually paint into it. Loading valid
  # is not the same as being visible: the POI markers were buried under the
  # opaque parcel fill while static, runtime and blank-render checks passed.
  - assert: qgis.every_declared_layer_renders
    modes: [visual]
  # The dashboard must open in a real browser with no errors, render the
  # map/legend/provenance the manifest declares, respond to layer toggles,
  # keep the scenario layer distinguishable, and support canonical reset.
  - assert: visual.dashboard_loads_in_browser
    modes: [visual]
    args: { screenshots_dir: "../visual/screenshots" }
  - assert: visual.dashboard_layout_within_viewport
    modes: [live, visual]

  - assert: presentation.layers_use_semantic_roles
  - assert: presentation.required_layer_groups_exist
    args: { groups: [analysis, user_overrides] }
  - assert: presentation.controls_match_pipeline
  - assert: presentation.edit_targets_reference_real_sources

  - assert: rerun.no_chat_dependency
    modes: [live]
  - assert: rerun.clean_execution_succeeded
    modes: [live]
    args: { rerun_workspace: "$RERUN" }
  - assert: rerun.outputs_semantically_equal
    modes: [live]
    args:
      rerun_workspace: "$RERUN"
      paths:
        - $OUTPUT:candidate_parcels
  - assert: rerun.validation_report_reproducible
    modes: [live]
    args: { rerun_workspace: "$RERUN" }

  - assert: overrides.source_files_byte_identical
    args:
      hashes_before: "$SOURCE_HASHES"
      paths:
        - data/source/parcels.geojson
        - data/source/roads.geojson
        - data/source/pois.geojson

  - assert: geodata.feature_geometries_match_source
    args: { path: "$OUTPUT:candidate_parcels", source_path: data/source/parcels.geojson, id_field: cadastral_id, comparison_crs: "EPSG:3301" }
