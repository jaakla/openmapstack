id: 018-coordinate-order-boundaries
case_type: positive
modes: [fixture, live]
score_types: {fixture: contract_ci, live: agent_benchmark}
project_dir: project
hard_gate: true
fixture:
  generator: "{python} {evals_dir}/fixtures/coordinate-order/gen.py {project_dir}"
  source_baseline:
    - {source: ../../fixtures/coordinate-order/anchor.json, destination: data/source/anchor.json}
live:
  prompt_file: prompt.md
  agent_workdir: project
  fixtures:
    - {source: ../../fixtures/coordinate-order/anchor.json, destination: project/data/source/anchor.json}

# Named input and independently fixed oracle pairs prevent a CRS label, legal
# coordinate ranges, or mutually consistent swapped outputs from passing.
assertions:
  - assert: geodata.coordinate_pair_equals
    args: {path: coordinate-payloads.json, field: geojson.coordinates, equals: [24.7536, 59.4370]}
  - assert: geodata.coordinate_pair_equals
    args: {path: coordinate-payloads.json, field: maplibre, equals: [24.7536, 59.4370]}
  - assert: geodata.coordinate_pair_equals
    args: {path: coordinate-payloads.json, field: leaflet_latlng, equals: [59.4370, 24.7536]}
  - assert: geodata.coordinate_pair_equals
    args: {path: coordinate-payloads.json, field: leaflet_geojson.coordinates, equals: [24.7536, 59.4370]}
