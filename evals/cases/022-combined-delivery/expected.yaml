id: 022-combined-delivery
case_type: positive
modes:
- fixture
- live
score_types:
  fixture: contract_ci
  live: agent_benchmark
project_dir: project
hard_gate: true
fixture:
  generator: '{python} {evals_dir}/fixtures/delivery/gen.py {project_dir} --targets
    dashboard,qgis,observable'
  source_baseline:
  - source: ../../fixtures/delivery/parcels.geojson
    destination: data/source/parcels.geojson
  clean_rerun: {}
live:
  prompt_file: prompt.md
  agent_workdir: project
  clean_rerun: {}
  fixtures:
  - source: ../../fixtures/delivery/parcels.geojson
    destination: project/data/source/parcels.geojson
assertions:
- assert: delivery.selection_is
  args:
    kinds:
    - dashboard
    - qgis
    - observable
- assert: delivery.declaration_valid
- assert: project.conforms_to_schema
- assert: project.graph_resolves
- assert: provenance.every_source_pinned
- assert: geodata.crs_not_used_for_metrics
- assert: presentation.layers_reference_outputs
- assert: geodata.row_count
  args:
    path: $OUTPUT:candidates
    equals: 1
- assert: geodata.feature_present
  args:
    path: $OUTPUT:candidates
    id_field: id
    id: large
- assert: geodata.field_range
  args:
    path: $OUTPUT:candidates
    field: area_m2
    min: 20000
    max: 20000
- assert: geodata.no_null_ids
  args:
    path: $OUTPUT:candidates
    id_field: area_m2
- assert: rerun.clean_execution_succeeded
  args:
    rerun_workspace: $RERUN
- assert: delivery.evidence_matches
  args:
    target_id: dashboard
- assert: delivery.web_view_loads
  args:
    target_id: dashboard
  hard_gate: false
- assert: delivery.evidence_matches
  args:
    target_id: qgis
- assert: qgis.static_valid
- assert: qgis.runtime_load
  hard_gate: false
- assert: delivery.evidence_matches
  args:
    target_id: observable
- assert: delivery.web_view_loads
  args:
    target_id: observable
  hard_gate: false
