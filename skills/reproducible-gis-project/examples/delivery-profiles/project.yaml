      captured_at: '2026-10-07T00:00:00Z'
    selection: {filter: All two fixture rectangles; no API pagination}
    schema: {crs: 'EPSG:3301', key: id, columns: [id, geometry]}
    license: {name: CC0-1.0, url: 'https://creativecommons.org/publicdomain/zero/1.0/'}
