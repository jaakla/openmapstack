  assumptions:
    - id: synthetic
      statement: The source contains synthetic simple rectangles in EPSG:3301.
      rationale: This offline contract example is not a factual parcel study.
sources:
  parcels:
    role: authoritative_input
    provider: OpenMapStack synthetic fixture
    dataset: Two synthetic rectangles
    source_url: https://example.invalid/synthetic-parcels
    access: {method: local, retrieved_at: '2026-10-07T00:00:00Z'}
    version: {identifier: synthetic-v1, published_at: '2026-10-07'}
    pin:
