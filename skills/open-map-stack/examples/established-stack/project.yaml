  scenarios:
    path: data/derived/scenarios.csv
    format: CSV
    kind: table
    generated_by: export
    role: exploratory_companion
    note: Precomputed canonical and exploratory thresholds; canonical remains the
      accepted result.
    table:
      key:
      - scenario
      columns:
      - name: scenario
        type: string
      - name: minimum_area_m2
        type: number
        unit: "m\xB2"
      - name: feature_count
        type: integer
        unit: features
      - name: area_m2
        type: number
        unit: "m\xB2"
