    - candidates_result
    - measured_result
    output: scenarios_result
    integration: analysis
  - id: export
    operation: export
    inputs:
    - candidates_result
    - scenarios_result
    output: analytical_outputs
  - id: render
    operation: render
    input: analytical_outputs
    output: views
outputs:
